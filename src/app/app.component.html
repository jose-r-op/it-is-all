<!-- Barra de navegación superior -->
<app-navbar [cartCount]="cartCount" (cartToggle)="toggleCart()" (navigate)="scrollTo($event)">
</app-navbar>

<main>
  <!-- Portada / Hero principal -->
  <app-hero (explore)="scrollTo('catalogo')" (manifesto)="scrollTo('nosotros')">
  </app-hero>

  <!-- Catálogo de productos con filtros y tallas -->
  <app-catalog [products]="catalog" [isLoading]="isLoadingProducts" [error]="productError" (retry)="fetchProducts()"
    (addToCart)="onAddToCart($event)">
  </app-catalog>

  <!-- Vista Rápida / Carrusel Cinético -->
  <section id="vista-rapida">
    <app-kinetic-carousel></app-kinetic-carousel>
  </section>

  <!-- Manifiesto de la marca -->
  <app-manifesto></app-manifesto>
</main>

<!-- Pie de página -->
<app-footer (navigate)="scrollTo($event)"></app-footer>

<!-- Panel lateral deslizante de la bolsa -->
<app-cart-drawer [isOpen]="isCartOpen" [items]="cart" (close)="closeCart()" (updateQuantity)="onUpdateQuantity($event)"
  (removeItem)="onRemoveFromCart($event)" (clear)="onClearCart()" (explore)="scrollTo('catalogo')">
</app-cart-drawer>

<!-- Notificación Toast flotante al agregar/eliminar -->
@if (activeNotification) {
<div class="toast-notification" role="status" aria-live="polite">
  <span class="toast-bullet"></span>
  <span class="toast-text">{{ activeNotification }}</span>
</div>
}
