@if (isOpen) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true">
    <div class="modal-card">
      <!-- Decoraciones tácticas angulares -->
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- Cabecera del modal -->
      <div class="modal-header">
        <div>
          <span class="modal-tag">// IDENTIFICACIÓN & ARSENAL //</span>
          <h2 class="modal-title">{{ isLoginMode ? 'ACCESO AL SISTEMA' : 'REGISTRO DE AGENTE' }}</h2>
        </div>
        <button type="button" class="close-btn" (click)="close.emit()" aria-label="Cerrar modal">
          ✕
        </button>
      </div>

      <!-- Pestañas de Login vs Registro -->
      <div class="tabs-bar">
        <button
          type="button"
          class="tab-btn"
          [class.active]="isLoginMode"
          (click)="switchMode(true)">
          INICIAR SESIÓN
        </button>
        <button
          type="button"
          class="tab-btn"
          [class.active]="!isLoginMode"
          (click)="switchMode(false)">
          REGISTRARSE
        </button>
      </div>

      <!-- Formulario interactivo -->
      <form class="auth-form" (ngSubmit)="onSubmit()">
        @if (!isLoginMode) {
          <div class="form-group">
            <label for="fullName">NOMBRE COMPLETO</label>
            <input
              id="fullName"
              type="text"
              name="fullName"
              [(ngModel)]="fullName"
              placeholder="Ej: Mateo Valenzuela"
              required />
          </div>
        }

        <div class="form-group">
          <label for="email">CORREO ELECTRÓNICO</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="usuario@itisall.com"
            required />
        </div>

        <div class="form-group">
          <label for="password">CONTRASEÑA</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••••••"
            required />
        </div>

        @if (!isLoginMode) {
          <div class="form-group">
            <label for="phoneNumber">TELÉFONO (OPCIONAL)</label>
            <input
              id="phoneNumber"
              type="tel"
              name="phoneNumber"
              [(ngModel)]="phoneNumber"
              placeholder="+57 300 000 0000" />
          </div>
        }

        <!-- Mensajes de feedback -->
        @if (errorMessage) {
          <div class="feedback-alert error">
            <span>⚠</span> {{ errorMessage }}
          </div>
        }
        @if (successMessage) {
          <div class="feedback-alert success">
            <span>✔</span> {{ successMessage }}
          </div>
        }

        <!-- Botón de Envío -->
        <button type="submit" class="submit-btn" [disabled]="isLoading">
          @if (isLoading) {
            <span class="spinner"></span> PROCESANDO...
          } @else {
            {{ isLoginMode ? 'ENTRAR AL ARSENAL' : 'CREAR CUENTA' }}
          }
        </button>

        <!-- Acceso Rápido Administrador Demo -->
        @if (isLoginMode) {
          <div class="admin-quick-access">
            <p class="quick-title">// ENTORNO DE PRUEBA //</p>
            <button type="button" class="quick-admin-btn" (click)="fillAdminCredentials()">
              ⚡ Autocompletar Admin (admin&#64;itisall.com)
            </button>
          </div>
        }
      </form>
    </div>
  </div>
}
